name: DSHNative

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: dev.leonardoxr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

configs:
  Debug: debug
  Release: release

targets:
  DSHNative:
    type: application
    platform: iOS
    sources:
      - path: DSHNative
        excludes:
          - Resources/Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DSHNative/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoxr.dshnative.ios
        PRODUCT_NAME: DSHNative
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          VALIDATE_PRODUCT: YES

  DSHNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DSHNativeTests
    dependencies:
      - target: DSHNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoxr.dshnative.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  DSHNative:
    build:
      targets:
        DSHNative: all
        DSHNativeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: DSHNativeTests
          parallelizable: false
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
