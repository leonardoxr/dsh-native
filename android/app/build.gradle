plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.leonardoxr.dshnative.android'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.leonardoxr.dshnative.android'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
