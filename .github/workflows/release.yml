name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) { console.error('Tag and package version differ'); process.exit(1) }"

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            artifact: windows-x64
          - os: macos-14
            args: --mac --x64
            artifact: macos-x64
          - os: macos-14
            args: --mac --arm64
            artifact: macos-arm64
          - os: ubuntu-latest
            args: --linux --x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify complete artifact set
        shell: bash
        working-directory: release-artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "DSH-Native-Setup-$version-win-x64.exe"
            "DSH-Native-Portable-$version-win-x64.exe"
            "DSH-Native-$version-mac-x64.dmg"
            "DSH-Native-$version-mac-x64.zip"
            "DSH-Native-$version-mac-arm64.dmg"
            "DSH-Native-$version-mac-arm64.zip"
            "DSH-Native-$version-linux-x64.AppImage"
            "DSH-Native-$version-linux-x64.deb"
          )
          for artifact in "${expected[@]}"; do
            test -f "$artifact" || { echo "Missing release artifact: $artifact"; exit 1; }
          done
          actual_count=$(find . -maxdepth 1 -type f | wc -l)
          test "$actual_count" -eq "${#expected[@]}" || {
            echo "Expected ${#expected[@]} artifacts, found $actual_count"
            find . -maxdepth 1 -type f -print
            exit 1
          }

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Native ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-artifacts/*
