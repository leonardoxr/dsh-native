name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) { console.error('Tag and package version differ'); process.exit(1) }"

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            artifact: windows-x64
            app_path: ""
          - os: macos-15
            args: --mac --arm64
            artifact: macos-arm64
            app_path: dist/mac-arm64/DSH Native.app
          - os: ubuntu-latest
            args: --linux --x64
            artifact: linux-x64
            app_path: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify and smoke-test macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          verify_signature() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            local details
            details=$(codesign -dv --verbose=4 "$app" 2>&1)
            printf '%s\n' "$details"
            grep -q "Signature=adhoc" <<<"$details"
          }

          verify_signature "${{ matrix.app_path }}"

          work="$RUNNER_TEMP/dsh-native-${{ matrix.artifact }}-verify"
          rm -rf "$work"
          mkdir -p "$work/zip" "$work/dmg"
          zip_files=(dist/*-mac-*.zip)
          dmg_files=(dist/*-mac-*.dmg)
          test "${#zip_files[@]}" -eq 1 && test -f "${zip_files[0]}"
          test "${#dmg_files[@]}" -eq 1 && test -f "${dmg_files[0]}"

          ditto -x -k "${zip_files[0]}" "$work/zip"
          verify_signature "$work/zip/DSH Native.app"

          cleanup_dmg() {
            hdiutil detach "$work/dmg" >/dev/null 2>&1 || hdiutil detach -force "$work/dmg" >/dev/null 2>&1 || true
          }
          hdiutil attach "${dmg_files[0]}" -nobrowse -readonly -mountpoint "$work/dmg"
          trap cleanup_dmg EXIT
          verify_signature "$work/dmg/DSH Native.app"
          cleanup_dmg
          trap - EXIT

          app_pid=""
          cleanup_app() {
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid"
              wait "$app_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_app EXIT
          "$work/zip/DSH Native.app/Contents/MacOS/DSH Native" --user-data-dir="$work/profile" &
          app_pid=$!
          sleep 8
          kill -0 "$app_pid"
          cleanup_app
          trap - EXIT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/DSH-Native-Setup-*.exe.blockmap
            dist/latest.yml
            dist/latest-mac.yml
            dist/latest-linux.yml

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify complete artifact set
        shell: bash
        working-directory: release-artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "DSH-Native-Setup-$version-win-x64.exe"
            "DSH-Native-Portable-$version-win-x64.exe"
            "DSH-Native-Setup-$version-win-x64.exe.blockmap"
            "latest.yml"
            "DSH-Native-$version-mac-arm64.dmg"
            "DSH-Native-$version-mac-arm64.zip"
            "latest-mac.yml"
            "DSH-Native-$version-linux-x86_64.AppImage"
            "DSH-Native-$version-linux-amd64.deb"
            "latest-linux.yml"
          )
          for artifact in "${expected[@]}"; do
            test -f "$artifact" || { echo "Missing release artifact: $artifact"; exit 1; }
          done
          actual_count=$(find . -maxdepth 1 -type f | wc -l)
          test "$actual_count" -eq "${#expected[@]}" || {
            echo "Expected ${#expected[@]} artifacts, found $actual_count"
            find . -maxdepth 1 -type f -print
            exit 1
          }

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: DSH Native ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-artifacts/*
